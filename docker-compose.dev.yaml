services:
  postgres:
    image: postgres:16-alpine
    container_name: boardsync-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boardsync_dev
    ports:
      - "7000:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - boardsync-network

  redis:
    image: redis:7-alpine
    container_name: boardsync-redis-dev
    # appendonly keeps the cache warm across restarts. Nothing here is a source of truth — losing
    # the whole instance costs a slow first request, not data.
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "7001:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - boardsync-network

  # Azure Blob Storage, locally. Backs profile pictures.
  #
  # The browser uploads straight to this endpoint with a URL the API signed, so the port has to be
  # published on the host — an internal-only service would be reachable by the API and by nothing
  # that actually sends the bytes.
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: boardsync-azurite-dev
    command: ["azurite-blob", "--blobHost", "0.0.0.0", "--location", "/data"]
    ports:
      - "10000:10000"   # Blob
    volumes:
      - azuritedata:/data
    networks:
      - boardsync-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: boardsync-mailhog-dev
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    environment:
      - MH_STORAGE=memory
    networks:
      - boardsync-network

volumes:
  pgdata:
  redisdata:
  azuritedata:

networks:
  boardsync-network:
    driver: bridge