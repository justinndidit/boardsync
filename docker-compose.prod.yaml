version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: boardsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boardsync-network

  redis:
    image: redis:7-alpine
    container_name: boardsync-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - boardsync-network

  api:
    build:
      context: ./server/BoardSync.Api
      dockerfile: Dockerfile
    container_name: boardsync-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # This stack has no separate migration step, so the single api container applies the schema
      # itself. A real deployment should leave this off and run migrations from the release
      # pipeline instead — see docs/scaling-realtime-caching.md §6.1.
      Database__AutoMigrate: "true"
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true
      AllowedOrigins__0: ${APP_ORIGIN}
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      EmailSettings__SmtpServer: ${SMTP_SERVER}
      EmailSettings__SenderEmail: ${SENDER_EMAIL}
      EmailSettings__Username: ${SMTP_USERNAME}
      EmailSettings__Password: ${SMTP_PASSWORD}
      EmailSettings__BaseUrl: ${APP_BASE_URL}
    expose:
      - "8080"
    networks:
      - boardsync-network

  ui:
    build:
      # The frontend lives in ui/boardsync and is its own git repository. If you
      # clone only this repo you will not have it — see docs/status-2026-08-24.md.
      context: ./ui/boardsync
      dockerfile: Dockerfile
      args:
        # The variable Vite actually reads. `VITE_API_BASE_URL` was passed here
        # and read by nothing, so every production build silently fell back to
        # the dev default.
        VITE_API_URL: /api
    container_name: boardsync-ui
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
    networks:
      - boardsync-network

volumes:
  pgdata:
  redisdata:

networks:
  boardsync-network:
    driver: bridge