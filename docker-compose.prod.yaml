version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: boardsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - boardsync-network

  redis:
    image: redis:7-alpine
    container_name: boardsync-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - boardsync-network

  api:
    build:
      context: ./server/BoardSync.Api
      dockerfile: Dockerfile
    container_name: boardsync-api
    restart: unless-stopped

    # Longer than the host's own ShutdownTimeout (30s, the .NET default), so the app decides when it
    # has finished rather than Docker deciding for it. The default here is 10s, which is shorter
    # than the budget the app is already working to: in-flight requests and a job being handed back
    # were killed with 20 seconds of that budget still unspent.
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # This stack has no separate migration step, so the single api container applies the schema
      # itself. A real deployment should leave this off and run migrations from the release
      # pipeline instead — see docs/scaling-realtime-caching.md §6.1.
      Database__AutoMigrate: "true"
      ConnectionStrings__Redis: redis:6379
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true
      AllowedOrigins__0: ${APP_ORIGIN}

      # Trust the forwarded headers, but only from inside this network.
      #
      # Without these the middleware is left out of the pipeline entirely and every request appears
      # to come from the nginx container: anonymous rate limits collapse into one bucket, and one
      # address is recorded against every refresh token and failed login. 172.16/12 is Docker's
      # default bridge pool, which is where these containers live.
      ForwardedHeaders__KnownNetworks__0: ${DOCKER_NETWORK_CIDR:-172.16.0.0/12}

      # Two, because there are two proxies: Caddy terminates TLS and the frontend's nginx routes.
      # Left at the default of 1 the middleware stops one hop short and hands back Caddy's address
      # instead of the client's — quietly, with everything still appearing to work.
      ForwardedHeaders__ForwardLimit: "2"
      JwtSettings__Secret: ${JWT_SECRET}
      JwtSettings__Issuer: ${JWT_ISSUER}
      JwtSettings__Audience: ${JWT_AUDIENCE}
      EmailSettings__SmtpServer: ${SMTP_SERVER}
      EmailSettings__SenderEmail: ${SENDER_EMAIL}
      EmailSettings__Username: ${SMTP_USERNAME}
      EmailSettings__Password: ${SMTP_PASSWORD}
      EmailSettings__BaseUrl: ${APP_BASE_URL}

      # Where the app is, which is not where the API is. Invitation links open a screen rather than
      # hitting an endpoint, so they are built from this; unset, they point at the API and 404.
      EmailSettings__AppBaseUrl: ${APP_ORIGIN}
      # Optional. Empty means no model is configured: decomposition and narratives answer with a
      # reason, and the reports they narrate over are unaffected because nothing there is generated.
      #
      # Provider is Anthropic or Gemini; only the matching key is read. Both are passed so switching
      # is an env change rather than a compose edit.
      Intelligence__Provider: ${INTELLIGENCE_PROVIDER:-Anthropic}
      Intelligence__AnthropicApiKey: ${ANTHROPIC_API_KEY:-}
      Intelligence__GeminiApiKey: ${GEMINI_API_KEY:-}

      # Object storage for profile pictures. Empty is a valid setting — the upload endpoints
      # answer 503 and the rest of the product is unaffected.
      Storage__ConnectionString: ${STORAGE_CONNECTION_STRING:-}
      Intelligence__GeminiModel: ${GEMINI_MODEL:-}
    expose:
      - "8080"
    networks:
      - boardsync-network

  ui:
    build:
      # The frontend lives in ui/boardsync and is its own git repository. If you
      # clone only this repo you will not have it — see docs/status-2026-08-24.md.
      context: ./ui/boardsync
      dockerfile: Dockerfile
      args:
        # The variable Vite actually reads. `VITE_API_BASE_URL` was passed here
        # and read by nothing, so every production build silently fell back to
        # the dev default.
        VITE_API_URL: /api
    container_name: boardsync-ui
    restart: unless-stopped
    depends_on:
      - api

    # No published port. Caddy holds 80 and 443 on the host and reaches this over the compose
    # network; publishing it here as well would both collide with Caddy and leave a plaintext copy
    # of the whole site reachable beside the HTTPS one.
    expose:
      - "80"
    networks:
      - boardsync-network

  # TLS termination and the only thing on this host listening to the internet.
  caddy:
    image: caddy:2-alpine
    container_name: boardsync-caddy
    restart: unless-stopped
    depends_on:
      - ui
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      # QUIC. Harmless if the host firewall drops it; HTTP/2 over TCP still serves everyone.
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro

      # Certificates and ACME account keys. This volume is the one that must survive a redeploy:
      # without it Caddy re-issues on every start, and Let's Encrypt's rate limit — 5 duplicate
      # certificates per domain per week — will lock you out of HTTPS for days.
      - caddydata:/data
      - caddyconfig:/config
    networks:
      - boardsync-network

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:

networks:
  boardsync-network:
    driver: bridge